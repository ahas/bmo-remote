# How the testbed checks, builds and deploys this repository, in the testbed's declaration format. The
# tests are deferred (README.md), so the suite gathers no test file yet.

testbed = 0
name = "bmo-remote"

[test]
# Bun runs the console bundle's check script.
languages = ["bun"]

[projects]
# The console plugin bundle under client/ is a project of its own, the vendored RDP backend's manifest inside
# it: its check script installs its locked packages and typechecks it.
paths = ["client"]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the count of lines with Korean each code file may hold,
# a file it does not name being allowed none: the Hangul the desktop's input method and the terminal's IME
# handle stand there.
quick = ["korean", "layout", "dependencies"]
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-markup"]

[[check.step]]
id = "check"
command = "cargo check --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

[build]
binaries = ["bmo-remote"]

# The service's own deploy tree, and the data root its settings stand under: the data root's env/remote.toml,
# which each release links to as settings.local.toml, the file the service reads beside settings.toml
# (docs/api.md, 「Settings」). It names the token, the desktop password and a store path under the data root.
[deploy]
root = "~/.local/share/bmo-remote"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.local.toml", target = "env/remote.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed settings name answers ready (docs/api.md, 「Health」).
health = "~/.local/share/bmo-remote/deploy/bin/bmo-remote health"
