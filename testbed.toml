# How the testbed checks, builds and deploys this repository, in the testbed's declaration format. The suite
# runs the repository-wide personal-data check (PERSONAL-DATA.md) and the behaviour tests that stand
# (README.md).

testbed = 0
name = "bmo-remote"

[test]
# Cargo runs the tests in tests/, the console test running bun on the vendored bmo-ui release, and Bun runs
# the two projects' check scripts.
languages = ["cargo", "bun"]
# A fresh tree gets each project's locked packages through the same frozen install its check script runs.
setup = ["cd client && bun install --frozen-lockfile", "cd desktop-sidecar && bun install --frozen-lockfile"]

[projects]
# The console plugin bundle under client/ is a project of its own, the vendored RDP backend's manifest inside
# it, and so is the desktop sidecar under desktop-sidecar/: each one's check script installs its locked
# packages and typechecks it, the bundle's running its tests and building its served module too, and Bun is
# the declared language that runs that script in the suite.
paths = ["client", "desktop-sidecar"]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the count of lines with Korean each code file may hold,
# a file it does not name being allowed none: the Hangul the desktop's input method and the terminal's IME
# handle stand there.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions"]
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-console-face", "bmo-ui", "bmo-markup"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the service. The testbed's own Cargo workspace check formats and lints the
# crate, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks it,
# and the change check compiles the crate a change marks; a change that marks none has no Rust to judge.

[build]
binaries = ["bmo-remote"]

# The service's own deploy tree, and the data root its settings stand under: the data root's env/remote.toml,
# which each release links to as settings.local.toml, the file the service reads beside settings.toml
# (docs/api.md, 「Settings」). It names the service's own token, the console's credential, the desktop password
# and a store path under the data root.
[deploy]
root = "~/.local/share/bmo-remote"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.local.toml", target = "env/remote.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed settings name answers ready (docs/api.md, 「Health」).
health = "~/.local/share/bmo-remote/deploy/bin/bmo-remote health"

# The service brings the remote screen to a console; once it is up the deployment probes its console face
# (docs/api.md, 「The console face」). Run from the release, the command prints how a console reaches the service
# from the release's settings (docs/api.md, 「The command」).
[deploy.console]
reach = "bin/bmo-remote console-reach"

# The console bundle's module, built in the release from its own sources before the release is put live, into
# the folder the service's console face answers it from (docs/api.md, 「The console plugin bundle」).
[[deploy.step]]
id = "console-bundle"
command = "cd client && bun run bundle"
phase = "before-flip"
