repository = "bmo-remote"
base = false

[coverage]
# The package's src/ and the console bundle under client/ from the layout, and the desktop sidecar beside them,
# whose TypeScript and focus watcher the service starts, but these: the two module folders that only list their
# modules, and the types generated from docs/openapi.json.
layout = "bmo-next"
roots = ["desktop-sidecar/"]
extensions = ["rs", "ts", "vue", "py"]
unindexed = ["src/desktop/mod.rs", "src/terminal/mod.rs", "client/shared/openapi.ts"]
