# The remote terminal and the remote desktop as one service: the HTTP and websocket server and its command
# in one binary. The only manifest at the root; the console plugin bundle keeps its own under `client/`.
[package]
name = "bmo-remote"
description = "The console's terminal sessions on this machine and its desktop reached over RDP."
version = "0.1.0-rev.5"
edition = "2024"
license = "MIT"
publish = false

[lib]
test = false

[[bin]]
name = "bmo-remote"
path = "src/main.rs"
test = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
# A new pointer shape's pixels, in base64 for the page.
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
# The settings: the built-in defaults, the deployment's files and the environment, layered in that order.
config = { version = "0.15", default-features = false, features = ["toml"] }
# A CredSSP message's length read off the stream.
der = "0.7.10"
# The stream and the sink of the frames a desktop socket hands on to the desktop sidecar.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# Each route registers itself beside its own answer.
inventory = "0.3.24"
# The desktop relay's RDP framing and security protocols.
ironrdp-pdu = "0.9.0"
# The handshake the browser's RDP client speaks to the relay.
ironrdp-rdcleanpath = "0.2.2"
# SQLite's own interface under the store's connections: the busy handler that waits for another writer's lock.
libsqlite3-sys = { version = "0.30.1", default-features = false }
# The account the service runs as, read from the passwd database.
nix = { version = "0.30.1", features = ["user"] }
# One pseudo-terminal per viewer of a terminal session.
portable-pty = "0.9.0"
# A new terminal session's id.
rand = "0.9.2"
# The client asking the service, over plain HTTP on the loopback address.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
# fcitx5's configuration files, for its trigger keys and its Hangul layout.
rust-ini = "0.21.3"
# The JSON Schemas of the wire types, for the OpenAPI document.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The digest a console bundle file's path is named by, so the path follows its bytes.
sha2 = "0.10.9"
# The store, one SQLite file.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
# The relay's network-level authentication toward the desktop: CredSSP with NTLM.
sspi = { version = "0.23.0", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.53.2", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# The desktop's sockets handed on to the desktop sidecar, as a websocket client toward it.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
# The desktop's certificate, for the public key CredSSP binds.
x509-cert = { version = "0.2.5", default-features = false }
# fcitx5's state, asked on the account's session bus.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The patterns the repository-wide personal-data check reads every tracked file with (tests/personal_data.rs).
regex = "1.13.1"

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
