# The tmux server that holds the remote screen's terminal sessions (docs/remote.md, 「What the configuration
# sets」). The service names this file in its `terminal.config` setting.
#
# tmux here is plumbing the browser never sees: no status line, no prefix key, and every key goes
# to the program in the pane.

set -g status off
set -g prefix None
set -g prefix2 None
unbind C-b

# The browser's terminal is xterm.js: 256 colours and true colour.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -s escape-time 10
set -s extended-keys on
set -s set-clipboard on
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 50000
set -g window-size latest

# The server stands until it is killed: a session nobody watches keeps running, and the last
# session ending does not take the server with it.
set -s exit-empty off
set -g destroy-unattached off

# Mouse support turns mouse reporting on in the browser's terminal on every attach, so a program
# that asked for the mouse gets it however the page was opened.
set -g mouse on

# A menu drawn inside the terminal on a right press is tmux's, not the program's.
unbind -n MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3Pane

# The wheel goes to the program when it asked for the mouse (or tmux is already scrolling), as
# arrow keys when the program is on the alternate screen, and otherwise scrolls tmux's history.
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { if -F '#{alternate_on}' { send-keys -N 3 Up } { copy-mode -e } }
bind -n WheelDownPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { if -F '#{alternate_on}' { send-keys -N 3 Down } }
